<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ibonarium flow</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

html,body{
  width:100%;
  background:#000;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial,sans-serif;
}

/* ===== FIX AUTO JUMPS ===== */

body{
  position:relative;
}

/* ===== SECTIONS ===== */

.section{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#000;
}

/* ===== IFRAMES ===== */

.frame{
  width:100%;
  border:none;
  display:block;
  background:#000;
}

/* ===== PAGE HEIGHTS ===== */

#tvFrame{
  height:100vh;
}

#museumFrame{
  height:2200px;
}

/* ===== SOFT TRANSITION ===== */

.fade::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-1px;
  width:100%;
  height:120px;
  pointer-events:none;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0),
    rgba(0,0,0,0.45),
    #000
  );

  z-index:5;
}

/* ===== MOBILE ===== */

@media(max-width:900px){

  #tvFrame{
    height:100svh;
  }

  #museumFrame{
    height:2600px;
  }

}
</style>
</head>

<body>

<!-- ===== FIRST PAGE ===== -->

<section class="section fade">

  <iframe
    id="tvFrame"
    class="frame"
    src="https://lavandaaudit.github.io/tv.2/"
    loading="eager"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>

</section>

<!-- ===== SECOND PAGE ===== -->

<section class="section">

  <iframe
    id="museumFrame"
    class="frame"
    src="https://lavandaaudit.github.io/history.musem.ibonarium/"
    loading="lazy"
    allowfullscreen>
  </iframe>

</section>

<script>
/* ===== DISABLE PAGE RESTORE ===== */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

/* ===== ALWAYS OPEN FROM TOP ===== */

window.addEventListener('load', () => {

  setTimeout(() => {
    window.scrollTo({
      top:0,
      left:0,
      behavior:'instant'
    });
  }, 10);

});

/* ===== BLOCK AUTO SCROLL FROM IFRAMES ===== */

window.addEventListener('focus', () => {
  document.documentElement.scrollTop = window.pageYOffset;
});

/* ===== ADAPTIVE HEIGHT ===== */

const museumFrame = document.getElementById("museumFrame");

function adaptiveMuseumHeight(){

  if(window.innerWidth < 900){
    museumFrame.style.height = "2600px";
  }else{
    museumFrame.style.height = "2200px";
  }

}

adaptiveMuseumHeight();

window.addEventListener("resize", adaptiveMuseumHeight);

/* ===== REMOVE AUTO VIDEO JUMPS ===== */

/* 
NO PARALLAX
NO AUTO TRANSFORM
NO AUTO POSITION CHANGES
ONLY MANUAL USER SCROLL
*/

document.addEventListener("visibilitychange", () => {

  if (!document.hidden) {

    const current = window.scrollY;

    requestAnimationFrame(() => {
      window.scrollTo(0, current);
    });

  }

});
</script>

</body>
</html>
